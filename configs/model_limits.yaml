# Model rate-limit catalogue. Reviewed 2026-10-26.
# Sources:
#   https://ai.google.dev/gemini-api/docs/rate-limits
#   https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash
#   https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite
#   https://developers.openai.com/api/docs/guides/rate-limits
#
# Active 3.5 model quotas supplied by the project owner from AI Studio, 2026-10-26:
#   Flash (3.5/3.6): 5 RPM, 250000 TPM, 20 RPD.
#   Flash-Lite:     15 RPM, 250000 TPM, 500 RPD.
# The two keys belong to separate projects with these quotas.
# Configured request caps reserve headroom below the supplied request quotas;
# TPM is the supplied quota, without a token margin. Do not also apply
# safety_margin unless you intentionally want additional headroom.
# Other models' active quotas remain unverified and are omitted.
# Fill in positive integer rpm/tpm/rpd values from your provider's quota page.
# Omitted dimensions use reactive 429 handling, not an invented quota.
# Gemini's 1,048,576 input / 65,536 output context limits are per request;
# they are NOT tokens-per-minute quotas and do not belong in tpm.
#
# Counters here are PER ENDPOINT (model/key). Google enforces quota PER PROJECT;
# keys in the same project share capacity. RPD resets at midnight Pacific time.
# Matching: exact name, most specific glob, provider '*', then '*' provider.

google:
  # Requested model ID retained; Google documents routing it to 3.6 Flash.
  gemini-3.5-flash:
    rpm: 4
    tpm: 250000
    rpd: 18
    daily_reset: midnight_pt
  gemini-3.5-flash-lite:
    rpm: 12
    tpm: 250000
    rpd: 490
    daily_reset: midnight_pt
  # Owner requested the same local caps as 3.5 Flash-Lite for this experiment.
  # Actual 3.1 project quotas have not been independently verified in AI Studio.
  gemini-3.1-flash-lite:
    rpm: 12
    tpm: 250000
    rpd: 490
    daily_reset: midnight_pt
  # Same upstream Flash quota; do not configure both aliases as independent capacity.
  gemini-3.6-flash:
    rpm: 4
    tpm: 250000
    rpd: 18
    daily_reset: midnight_pt
  gemini-2.5-pro:
    daily_reset: midnight_pt
  gemini-2.5-flash:
    daily_reset: midnight_pt
  gemini-2.5-flash-lite:
    daily_reset: midnight_pt
  "gemini-*":
    daily_reset: midnight_pt

openai:
  # Organization/project/tier-specific; set verified values before pre-limiting.
  gpt-4o-mini: {}
